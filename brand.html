<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Dashboard | Creator Cash Flow</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="public-header">
        <a class="cc-logo" href="/#landing">Creator Cash Flow</a>
        <div class="hq-header-actions">
            <span class="hq-plan">Brand Pilot</span>
            <button class="hq-signout" onclick="localStorage.removeItem('ccf_session'); window.location.href='/#login'">Sign out</button>
        </div>
    </header>
    <main class="hq-shell">
        <div class="hq-welcome">
            <div>
                <span class="hq-eyebrow">Brand Workspace</span>
                <h1>Campaign Tracker</h1>
                <p>Monitor live ROI, review deliverables, and fund creators securely.</p>
            </div>
        </div>
        <div class="hq-content-grid">
            <section class="hq-panel">
                <div class="hq-empty">
                    <h3>No active campaigns</h3>
                    <p>Start a new campaign with a creator or agency to track deliverables here.</p>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
